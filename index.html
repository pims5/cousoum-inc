<!doctype html>
<html lang="fr-SN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Private Access | COUSOUM INC</title>
  <meta name="description" content="Espace privé COUSOUM INC.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#071720">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main id="main">
    <section class="access">
      <div class="access-panel">
        <a class="brand" href="../index.html">COUSOUM INC</a>
        <div class="eyebrow" style="margin-top:42px">PRIVATE ACCESS</div>
        <h2>Votre espace privilégié commence ici.</h2>
        <p>Accès réservé aux clients, partenaires et utilisateurs autorisés.</p>
        <div class="tabs">
          <button class="tab active" type="button" data-tab="passwordPanel">Mot de passe</button>
          <button class="tab" type="button" data-tab="codePanel">Code sécurisé</button>
        </div>
        <form id="passwordPanel" data-panel class="form" onsubmit="return false">
          <div class="field"><label for="loginEmail">Adresse e-mail</label><input id="loginEmail" type="email" autocomplete="username" required></div>
          <div class="field"><label for="loginPassword">Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
          <button class="btn gold" type="button">Se connecter</button>
        </form>
        <form id="codePanel" data-panel class="form" hidden onsubmit="return false">
          <div class="field"><label for="codeEmail">Adresse e-mail professionnelle</label><input id="codeEmail" type="email" autocomplete="email" required></div>
          <button class="btn gold" type="button">Recevoir mon code</button>
        </form>
        <p class="notice">Version V1 de présentation. L’authentification sécurisée sera activée ultérieurement.</p>
        <p><a href="../index.html">← Retour au site</a></p>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll('[data-tab]').forEach(tab=>tab.addEventListener('click',()=>{
      document.querySelectorAll('[data-tab]').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=true);
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).hidden=false;
    }));
  </script>
</body>
</html>
